name: PR Check

on:
  pull_request:
    branches: [main]

jobs:
  require-dev-base:
    name: PRs to main must come from dev
    runs-on: ubuntu-latest
    steps:
      - name: Check base branch
        if: github.base_ref == 'main' && github.head_ref != 'dev'
        run: |
          echo "❌ Direct PRs to main are not allowed."
          echo "Please merge into 'dev' first, then open a PR from dev → main."
          exit 1
      - name: OK
        run: echo "✅ Branch policy check passed."
